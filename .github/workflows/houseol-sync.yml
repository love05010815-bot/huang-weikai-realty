# 登入愛屋、重抓「委託中」列表，更新 src/config/houseol-inventory.json。
#
# ⚠️ 2026-08-25 排程已關閉。試了七輪修法（換頁競速、輪詢等穩定、拿掉
#    webdriver 偵測訊號…），登入請求本身還是收不到任何伺服器回應
#    （postback 狀態一直是 null，沒有錯誤文字、沒有 WAF 標頭痕跡），
#    已經超出從程式碼層面能繼續排查的範圍，停損退回手動書籤流程
#    （tools/houseol/install.html，不受影響、隨時可用）。
#
#    這支 workflow 留著、Secrets 也留著沒刪，只是不會自動跑了——
#    可以用 Actions 分頁的 workflow_dispatch 手動觸發繼續測試，
#    或哪天想重新查這個問題再回來用。
#
# 需要在 repo Settings → Secrets and variables → Actions 設定：
#   HOUSEOL_STORE_CODE   愛屋店代號
#   HOUSEOL_USERNAME     愛屋帳號
#   HOUSEOL_PASSWORD     愛屋密碼
#   VERCEL_DEPLOY_HOOK   跟 .env.local 裡那組一樣（觸發部署用）
#
# 抓到新資料才會 commit＋觸發部署；沒變化就什麼都不做，不會產生空 commit。
name: houseol-sync

on:
  workflow_dispatch:

concurrency:
  group: houseol-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 裝抓取工具的依賴（跟主專案分開，不影響網站 build）
        working-directory: tools/houseol
        run: npm install

      - name: 裝瀏覽器核心
        working-directory: tools/houseol
        run: npx playwright install --with-deps chromium

      - name: 登入愛屋、抓全部頁數
        working-directory: tools/houseol
        env:
          HOUSEOL_STORE_CODE: ${{ secrets.HOUSEOL_STORE_CODE }}
          HOUSEOL_USERNAME: ${{ secrets.HOUSEOL_USERNAME }}
          HOUSEOL_PASSWORD: ${{ secrets.HOUSEOL_PASSWORD }}
        run: node auto-scrape.js

      - name: 有新資料才 commit
        id: diff
        run: |
          if git diff --quiet -- src/config/houseol-inventory.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "跟現有的比沒有變化，不 commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推回 main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "houseol-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/config/houseol-inventory.json
          git commit -m "愛屋庫存池自動同步 $(date -u +%Y-%m-%d)"
          git push

      - name: 觸發正式站部署
        if: steps.diff.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "沒設定 VERCEL_DEPLOY_HOOK，跳過部署——資料已經進 main 了，之後手動部署一次就好"
            exit 0
          fi
          curl -sS -X POST "$HOOK"
