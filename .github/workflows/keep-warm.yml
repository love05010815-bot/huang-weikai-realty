# 保溫排程：定期喚醒 Vercel 函式與 TiDB，避免閒置後的第一位客戶等 25–35 秒。
#
# 為什麼不用 Vercel Cron：免費方案一天只能跑一次，而且觸發時間在該小時內浮動，
# 拿來保溫完全沒有意義。GitHub Actions 對 public repo 免費且沒有這個限制。
#
# ⚠️ 已知限制：
#   1. GitHub 的排程在尖峰時段會延遲數分鐘，不保證準時（保溫不需要準時，可接受）。
#   2. repo 連續 60 天沒有任何 commit，GitHub 會自動停用排程工作流程。
#      真的停了，到 Actions 分頁按 "Enable workflow" 重新啟用即可。
name: keep-warm

on:
  schedule:
    # 每 10 分鐘。再密沒有意義，也只是多燒 Actions 額度。
    - cron: "*/10 * * * *"
  # 允許手動觸發，方便驗證有沒有真的通。
  workflow_dispatch:

# 只保留最新一次，避免 GitHub 延遲補跑時堆積。
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://weikaihouse.com/api/health"

          # 第一次多半是冷啟動，會很慢，所以給 60 秒；失敗就重試兩次。
          for attempt in 1 2 3; do
            echo "── 第 $attempt 次 ──"
            HTTP=$(curl -sS -o /tmp/body.json -w '%{http_code}' --max-time 60 "$URL") && {
              echo "HTTP $HTTP"
              cat /tmp/body.json
              echo ""
              if [ "$HTTP" = "200" ]; then
                echo "✅ 保溫成功"
                exit 0
              fi
            }
            echo "⚠️ 這次沒成功，等 15 秒再試"
            sleep 15
          done

          echo "❌ 三次都失敗，網站或資料庫可能真的有問題"
          exit 1

      # 每天早上抓房產新聞（後台 /admin/news）。端點自己會判斷該不該跑：
      # 台北時間過 09:00 後、今天還沒成功過才真的抓，其餘時候只是一個 SELECT 就回來。
      # 所以每 10 分鐘來一次沒有成本，也不需要任何密鑰。抓一次最多 60 秒。
      # 這一步失敗不能讓保溫變紅 —— 它跟保溫是兩件事。
      #
      # ⚠️ 2026-09-18 起這裡只是**備援**：主要觸發改成 Vercel 自己的排程（`vercel.json` 的 crons，
      #    每天 01:00 UTC ＝台北 09:00）。原因是 GitHub 的排程在尖峰會被延遲甚至跳過 ——
      #    9/17 實際延到台北 13:26 才抓到當天新聞，而他要的是「每天早上九點更新當天新聞」。
      #    兩條都指向同一個自我限制的端點，誰先到都一樣，一天仍然只會成功一次。
      - name: Trigger daily news fetch (self-limiting)
        if: always()
        continue-on-error: true
        run: |
          curl -sS --max-time 90 "https://weikaihouse.com/api/news/daily" || echo "（新聞抓取這次沒回應，端點下次會再判斷）"
          echo ""

      # 愛屋店網物件同步（後台 /admin/match）。端點自己會判斷：距上次成功不到 30 分鐘就只是兩個 SELECT 回來，
      # 所以每 10 分鐘敲一次沒有成本，也不需要任何密鑰。真的跑一次約 30–40 秒。
      # 跟保溫是兩件事，失敗不能讓保溫變紅。
      - name: Trigger houseol listing sync (self-limiting)
        if: always()
        continue-on-error: true
        run: |
          curl -sS --max-time 90 "https://weikaihouse.com/api/match/sync" || echo "（物件同步這次沒回應，端點下次會再判斷）"
